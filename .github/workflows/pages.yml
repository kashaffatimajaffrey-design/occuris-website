# Publishes the site to https://occurisai.github.io on every push to main.
# Runs only in the occurisai/occurisai.github.io repository; the copy of this
# repo under a personal account skips it. Cloudflare Pages is deployed
# separately with `pnpm run deploy`.
name: Publish to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    if: github.repository == 'occurisai/occurisai.github.io'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: withastro/action@v3
        with:
          node-version: 22
          package-manager: pnpm@11.9.0
        env:
          SITE_URL: https://occurisai.github.io

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
